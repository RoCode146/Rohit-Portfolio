<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --error-color: #e74c3c;
      --background-color: #f8fafc;
      --border-radius: 8px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0e7ff, var(--background-color));
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .login-container {
      background: #fff;
      max-width: 400px;
      width: 100%;
      padding: 2rem;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h2 {
      color: var(--primary-color);
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      font-size: 1rem;
      transition: var(--transition);
    }

    input:focus {
      border-color: var(--accent-color);
      outline: none;
      box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
    }

    input.error {
      border-color: var(--error-color);
    }

    .error-message {
      color: var(--error-color);
      font-size: 0.85rem;
      margin-top: 0.25rem;
      display: none;
    }

    .server-error {
      color: var(--error-color);
      font-size: 0.9rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    button:hover:not(:disabled) {
      background: #2980b9;
    }

    button:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .login-container {
        padding: 1.5rem;
      }

      h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="server-error">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}
    <form method="POST" id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          name="username"
          id="username"
          placeholder="Enter username"
          required
          aria-describedby="usernameError"
        />
        <span class="error-message" id="usernameError">Username is required</span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter password"
          required
          aria-describedby="passwordError"
        />
        <span class="error-message" id="passwordError">Password is required</span>
      </div>
      <button type="submit" id="submitBtn">Login</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      let isValid = true;

      // Reset error states
      ['username', 'password'].forEach(field => {
        const input = document.getElementById(field);
        const error = document.getElementById(`${field}Error`);
        input.classList.remove('error');
        error.style.display = 'none';
      });

      // Validate inputs
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username) {
        showError('username', 'Username is required');
        isValid = false;
      }

      if (!password) {
        showError('password', 'Password is required');
        isValid = false;
      } else if (password.length < 6) {
        showError('password', 'Password must be at least 6 characters');
        isValid = false;
      }

      if (isValid) {
        submitBtn.disabled = true;
        submitBtn.classList.add('loading');
        submitBtn.textContent = 'Logging in';

        // Simulate form submission (replace with actual submission)
        setTimeout(() => {
          form.submit();
        }, 500); // Delay for demo; remove in production
      }
    });

    function showError(field, message) {
      const input = document.getElementById(field);
      const error = document.getElementById(`${field}Error`);
      input.classList.add('error');
      error.textContent = message;
      error.style.display = 'block';
    }
  </script>
</body>
</html>
